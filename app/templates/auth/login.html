{% extends "base.html" %}
{% block title %}Sign In - Poloflix{% endblock %}
{% block body_class %}is-auth{% endblock %}

{% block content %}
<div class="auth-page">
  <form method="post" class="auth-card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1>Sign In</h1>
    <label>Email or Username<input type="text" name="identifier" required autofocus></label>
    <label>Password<input type="password" name="password" required></label>
    <div class="auth-card__row">
      <label class="checkbox"><input type="checkbox" name="remember"> Remember me</label>
      <a href="#" class="auth-card__link">Forgot password?</a>
    </div>
    <button class="btn btn--primary btn--block" type="submit">Sign In</button>
    <p class="auth-card__footer">New to Poloflix? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </form>
</div>
{% endblock %}
